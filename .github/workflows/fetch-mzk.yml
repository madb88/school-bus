name: Fetch MZK GTFS schedule

on:
  schedule:
    # Around 06:00 Europe/Warsaw (UTC shifts with DST).
    # Gate below no-ops the wrong UTC hour.
    - cron: "0 4 * * *" # 06:00 CEST
    - cron: "0 5 * * *" # 06:00 CET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to fetch
        id: gate
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          echo "warsaw_hour=$HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "should_fetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_fetch=false" >> "$GITHUB_OUTPUT"
            echo "Skipping fetch (Warsaw hour=$HOUR, want 06)."
          fi

      - name: Checkout
        if: steps.gate.outputs.should_fetch == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.should_fetch == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_fetch == 'true'
        run: npm ci

      - name: Fetch MZK GTFS
        if: steps.gate.outputs.should_fetch == 'true'
        run: npm run fetch:mzk

      - name: Verify MZK snapshot
        if: steps.gate.outputs.should_fetch == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const path = 'data/mzk-schedule.json';
            if (!fs.existsSync(path)) {
              console.error('Missing MZK schedule snapshot after fetch.');
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const stops = Array.isArray(data.stops) ? data.stops.length : 0;
            const trips = Array.isArray(data.trips) ? data.trips.length : 0;
            if (stops === 0 || trips === 0) {
              console.error('MZK schedule snapshot is empty — GTFS fetch/parse likely broke.');
              process.exit(1);
            }
            console.log('MZK snapshot OK:', { stops, trips, fetchedAt: data.fetchedAt, feedEndDate: data.feedEndDate });
          "

      - name: Commit snapshot if changed
        if: steps.gate.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mzk-schedule.json
          if git diff --staged --quiet; then
            echo "No MZK schedule changes."
            exit 0
          fi
          git commit -m "chore: update MZK schedule snapshot"
          git push

      - name: Notify on failure
        if: failure() && steps.gate.outputs.should_fetch == 'true'
        run: |
          echo "::error::Fetch MZK GTFS failed. GitHub notifies repository watchers on failed workflow runs — check Actions logs and the MZK developer feed."
          exit 1
