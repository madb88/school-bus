name: Scrape dowozy schedule

on:
  schedule:
    # Hourly; job no-ops unless Europe/Warsaw hour is 5 or 22.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to scrape
        id: gate
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          echo "warsaw_hour=$HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "05" ] || [ "$HOUR" = "22" ]; then
            echo "should_scrape=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_scrape=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scrape (Warsaw hour=$HOUR, want 05 or 22)."
          fi

      - name: Checkout
        if: steps.gate.outputs.should_scrape == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.should_scrape == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_scrape == 'true'
        run: npm ci

      - name: Scrape schedule
        if: steps.gate.outputs.should_scrape == 'true'
        run: npm run scrape:dowozy

      - name: Commit snapshot if changed
        if: steps.gate.outputs.should_scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dowozy-schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git commit -m "chore: update dowozy schedule snapshot"
          git push
