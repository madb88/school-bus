name: Scrape dowozy schedule

on:
  schedule:
    # Around 06:00 Europe/Warsaw (UTC shifts with DST).
    # Gate below no-ops the wrong UTC hour.
    - cron: "0 4 * * *" # 06:00 CEST
    - cron: "0 5 * * *" # 06:00 CET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to scrape
        id: gate
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          echo "warsaw_hour=$HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "should_scrape=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_scrape=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scrape (Warsaw hour=$HOUR, want 06)."
          fi

      - name: Checkout
        if: steps.gate.outputs.should_scrape == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.should_scrape == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_scrape == 'true'
        run: npm ci

      - name: Scrape schedule
        if: steps.gate.outputs.should_scrape == 'true'
        run: npm run scrape:dowozy

      - name: Verify school snapshot
        if: steps.gate.outputs.should_scrape == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const path = 'data/dowozy-schedule.json';
            if (!fs.existsSync(path)) {
              console.error('Missing school schedule snapshot after scrape.');
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const pickups = Array.isArray(data.pickups) ? data.pickups.length : 0;
            const dropoffs = Array.isArray(data.dropoffsByDate) ? data.dropoffsByDate.length : 0;
            const weekday = Array.isArray(data.dropoffsWeekday) ? data.dropoffsWeekday.length : 0;
            if (pickups === 0 && dropoffs === 0 && weekday === 0) {
              console.error('School schedule snapshot is empty — scrape likely broke.');
              process.exit(1);
            }
            console.log('School snapshot OK:', { pickups, dropoffs, weekday, fetchedAt: data.fetchedAt });
          "

      - name: Commit snapshot if changed
        if: steps.gate.outputs.should_scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dowozy-schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git commit -m "chore: update dowozy schedule snapshot"
          git push

      - name: Notify on failure
        if: failure() && steps.gate.outputs.should_scrape == 'true'
        run: |
          echo "::error::Scrape dowozy schedule failed. GitHub notifies repository watchers on failed workflow runs — check Actions logs and the school source page."
          exit 1
