<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111821" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Rozkład offline · autobusszkolny</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111821;
        --fg: #e8eef5;
        --muted: #9aa8b8;
        --bus: #3d7eff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.45;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        padding-top: max(1.5rem, env(safe-area-inset-top));
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      .muted {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 22rem;
        margin: 0 auto;
      }
      .actions {
        margin-top: 1.5rem;
      }
      button.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1rem;
        border-radius: 0.6rem;
        border: none;
        font-size: 0.95rem;
        font-weight: 600;
        background: var(--bus);
        color: #fff;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <h1 id="heading">Rozkład offline</h1>
      <p id="status" class="muted">Wczytywanie…</p>
      <div class="actions" id="actions" hidden></div>
    </main>
    <script>
      (function () {
        var ENTITLEMENT_KEY = "school-bus.offline-entitlement.v1";
        var headingEl = document.getElementById("heading");
        var statusEl = document.getElementById("status");
        var actionsEl = document.getElementById("actions");

        function warsawYmd() {
          try {
            var parts = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Europe/Warsaw",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).formatToParts(new Date());
            var y = parts.find(function (p) {
              return p.type === "year";
            }).value;
            var m = parts.find(function (p) {
              return p.type === "month";
            }).value;
            var d = parts.find(function (p) {
              return p.type === "day";
            }).value;
            return y + "-" + m + "-" + d;
          } catch (e) {
            return new Date().toISOString().slice(0, 10);
          }
        }

        function hasEntitlement() {
          try {
            var raw = localStorage.getItem(ENTITLEMENT_KEY);
            if (!raw) return false;
            var parsed = JSON.parse(raw);
            return (
              typeof parsed.validUntil === "string" &&
              parsed.validUntil >= warsawYmd()
            );
          } catch (e) {
            return false;
          }
        }

        function showMessage(title, detail) {
          if (headingEl) headingEl.textContent = title;
          if (statusEl) statusEl.textContent = detail || "";
        }

        function showReload() {
          if (!actionsEl) return;
          actionsEl.hidden = false;
          actionsEl.innerHTML =
            '<button type="button" class="btn" id="reload-btn">Odśwież</button>';
          var btn = document.getElementById("reload-btn");
          if (btn) {
            btn.addEventListener("click", function () {
              location.reload();
            });
          }
        }

        if (navigator.onLine) {
          fetch("/sw.js", { method: "GET", cache: "no-store" })
            .then(function (res) {
              if (res && res.ok) {
                location.replace("/");
                return;
              }
              showMessage(
                "Aplikacja chwilowo niedostępna",
                "Serwer aplikacji nie odpowiada. Sprawdź połączenie i odśwież.",
              );
              showReload();
            })
            .catch(function () {
              showMessage(
                "Aplikacja chwilowo niedostępna",
                "Serwer aplikacji nie odpowiada. Sprawdź połączenie i odśwież.",
              );
              showReload();
            });
          return;
        }

        if (hasEntitlement()) {
          showMessage("Rozkład offline", "Otwieram Twój zapisany rozkład…");
          location.replace("/offline");
          return;
        }

        showMessage(
          "Brak połączenia z internetem",
          "Bez internetu nie ma dostępu do aplikacji. Tryb offline z lokalną kopią rozkładu jest dostępny w Planie Plus — po wcześniejszym otwarciu aplikacji online.",
        );
        showReload();
      })();
    </script>
  </body>
</html>
